HTML

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<title>ابراج الاصیل CRM V2</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{--g:#14532d;--bg:#f3f6f3;--line:#dce5dd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#17251b}
header{background:var(--g);color:white;padding:18px}
nav{display:flex;overflow:auto;gap:7px;padding:9px;background:white;position:sticky;top:0}
button{border:0;border-radius:8px;padding:11px;cursor:pointer}
nav button{background:#e9f0ea;color:#183c25;white-space:nowrap}
nav button.active,.action{background:var(--g);color:white}
main{padding:13px;max-width:850px;margin:auto}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
.field{margin-bottom:9px}
label{display:block;font-size:12px;margin-bottom:4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd8ce;border-radius:8px;font:14px Tahoma}
textarea{min-height:65px}
.item{border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:9px}
.money{font-weight:bold;color:var(--g)}
.hidden{display:none!important}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.light{background:#e9f0ea;color:#183c25}
.danger{background:#fff0f0;color:#a32626}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:#f0f6f1;padding:12px;border-radius:9px}
.stat b{display:block;font-size:18px;margin-top:5px}
.muted{font-size:12px;color:#65736a}
</style>
</head>
<body>
<header>
<h2>دفتر رهنمای معاملات ابراج الاصیل</h2>
<p>مدیریت املاک، مشتریان و کمیسیون‌ها</p>
</header>

<nav>
<button class="active" data-tab="home">خانه</button>
<button data-tab="properties">املاک</button>
<button data-tab="customers">مشتریان</button>
<button data-tab="commissions">کمیسیون‌ها</button>
<button data-tab="backup">پشتیبان‌گیری</button>
</nav>

<main>
<section id="home" class="tab">
<div class="panel">
<h3>خلاصه دفتر</h3>
<div class="statgrid">
<div class="stat">املاک<b id="sProps">۰</b></div>
<div class="stat">مشتریان<b id="sCust">۰</b></div>
<div class="stat">کمیسیون<b id="sTotal">۰</b></div>
</div>
</div>
</section>

<section id="properties" class="tab hidden">
<div class="panel">
<h3>ثبت ملک</h3>
<form id="propForm">
<div class="grid">
<div class="field"><label>نوع معامله</label>
<select id="pDeal"><option>فروش</option><option>کرایی</option><option>بیع وفا</option></select></div>
<div class="field"><label>نوع ملک</label>
<select id="pType"><option>خانه</option><option>زمین</option><option>دکان</option><option>آپارتمان</option><option>دفتر</option></select></div>
<div class="field"><label>نام مالک</label><input id="pOwner" required></div>
<div class="field"><label>شماره تماس</label><input id="pPhone" inputmode="tel"></div>
<div class="field"><label>ناحیه</label><input id="pDistrict"></div>
<div class="field"><label>موقعیت</label><input id="pLocation"></div>
<div class="field"><label>قیمت افغانی</label><input id="pPrice" inputmode="decimal"></div>
<div class="field"><label>مساحت مترمربع</label><input id="pArea" inputmode="decimal"></div>
</div>
<label>توضیحات</label><textarea id="pNotes"></textarea>
<div class="actions"><button class="action">ذخیره ملک</button></div>
</form>
</div>
<div class="panel"><h3>فهرست املاک</h3><div id="propList"></div></div>
</section>

<section id="customers" class="tab hidden">
<div class="panel">
<h3>ثبت مشتری</h3>
<form id="custForm">
<div class="grid">
<div class="field"><label>نام مشتری</label><input id="cName" required></div>
<div class="field"><label>شماره تماس</label><input id="cPhone" inputmode="tel"></div>
<div class="field"><label>نوع ملک</label><select id="cType"><option>خانه</option><option>زمین</option><option>دکان</option><option>آپارتمان</option><option>هر نوع</option></select></div>
<div class="field"><label>نوع درخواست</label><select id="cDeal"><option>خرید</option><option>کرایه</option><option>بیع وفا</option><option>فروش</option></select></div>
<div class="field"><label>حداقل بودجه</label><input id="cMin"></div>
<div class="field"><label>حداکثر بودجه</label><input id="cMax"></div>
<div class="field"><label>ناحیه</label><input id="cDistrict"></div>
</div>
<label>توضیحات</label><textarea id="cNotes"></textarea>
<button class="action">ذخیره مشتری</button>
</form>
</div>
<div class="panel"><h3>فهرست مشتریان</h3><div id="custList"></div></div>
</section>

<section id="commissions" class="tab hidden">
<div class="panel">
<h3>ثبت کمیسیون</h3>
<form id="comForm">
<div class="grid">
<div class="field"><label>نام طرف حساب</label><input id="mClient" required></div>
<div class="field"><label>شرح معامله</label><input id="mDesc"></div>
<div class="field"><label>کمیسیون توافق‌شده</label><input id="mTotal" required></div>
<div class="field"><label>پرداخت‌شده</label><input id="mPaid" value="0"></div>
</div>
<button class="action">ذخیره کمیسیون</button>
</form>
</div>
<div class="panel"><h3>فهرست کمیسیون‌ها</h3><div id="comList"></div></div>
</section>

<section id="backup" class="tab hidden">
<div class="panel">
<h3>پشتیبان‌گیری</h3>
<button class="action" onclick="backup()">دانلود پشتیبان اطلاعات</button>
<label style="margin-top:15px">بازیابی فایل پشتیبان</label>
<input type="file" id="restoreFile" accept=".json">
<button class="action" onclick="restore()">بازیابی اطلاعات</button>
</div>
</section>
</main>

<script>
const KEY='abraj_aseel_offline_v2';
let db;
try{
db=JSON.parse(localStorage.getItem(KEY))||{properties:[],customers:[],commissions:[]};
}catch(e){
db={properties:[],customers:[],commissions:[]};
}
function save(){
localStorage.setItem(KEY,JSON.stringify(db));
render();
}
function val(id){return document.getElementById(id).value.trim()}
function fmt(n){return Number(n||0).toLocaleString('fa-IR')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
document.querySelectorAll('nav button').forEach(b=>{
b.onclick=()=>{
document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));
document.getElementById(b.dataset.tab).classList.remove('hidden');
render();
};
});
document.getElementById('propForm').onsubmit=e=>{
e.preventDefault();
db.properties.unshift({id:makeId(),deal:val('pDeal'),type:val('pType'),owner:val('pOwner'),phone:val('pPhone'),district:val('pDistrict'),location:val('pLocation'),price:Number(val('pPrice'))||0,area:Number(val('pArea'))||0,notes:val('pNotes')});
e.target.reset();save();
};
document.getElementById('custForm').onsubmit=e=>{
e.preventDefault();
db.customers.unshift({id:makeId(),name:val('cName'),phone:val('cPhone'),type:val('cType'),deal:val('cDeal'),min:Number(val('cMin'))||0,max:Number(val('cMax'))||0,district:val('cDistrict'),notes:val('cNotes')});
e.target.reset();save();
};
document.getElementById('comForm').onsubmit=e=>{
e.preventDefault();
let total=Number(val('mTotal'))||0,paid=Number(val('mPaid'))||0;
if(paid>total){alert('پرداخت بیشتر از کمیسیون است');return}
db.commissions.unshift({id:makeId(),client:val('mClient'),desc:val('mDesc'),total,paid});
e.target.reset();save();
};
function del(type,id){
if(confirm('حذف شود؟')){
db[type]=db[type].filter(x=>x.id!==id);save();
}
}
function render(){
document.getElementById('propList').innerHTML=db.properties.map(o=>`<div class="item"><b>${esc(o.type)} — ${esc(o.owner)}</b><p>${esc(o.phone)} | ناحیه ${esc(o.district)}</p><b class="money">${fmt(o.price)} افغانی</b><p>${fmt(o.area)} مترمربع — ${esc(o.location)}</p><button class="danger" onclick="del('properties','${o.id}')">حذف</button></div>`).join('')||'هنوز ملکی ثبت نشده است';
document.getElementById('custList').innerHTML=db.customers.map(o=>`<div class="item"><b>${esc(o.name)}</b><p>${esc(o.phone)} | ${esc(o.type)} | ${esc(o.deal)}</p><p>بودجه ${fmt(o.min)} تا ${fmt(o.max)}</p><button class="danger" onclick="del('customers','${o.id}')">حذف</button></div>`).join('')||'هنوز مشتری ثبت نشده است';
document.getElementById('comList').innerHTML=db.commissions.map(o=>`<div class="item"><b>${esc(o.client)}</b><p>${esc(o.desc)}</p>کل: ${fmt(o.total)} — پرداخت: ${fmt(o.paid)} — باقی: ${fmt(o.total-o.paid)}<br><button class="danger" onclick="del('commissions','${o.id}')">حذف</button></div>`).join('')||'هنوز کمیسیونی ثبت نشده است';
document.getElementById('sProps').textContent=fmt(db.properties.length);
document.getElementById('sCust').textContent=fmt(db.customers.length);
document.getElementById('sTotal').textContent=fmt(db.commissions.reduce((s,o)=>s+o.total,0));
}
function backup(){
let a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
a.download='abraj-aseel-backup.json';a.click();
URL.revokeObjectURL(a.href);
}
function restore(){
let f=document.getElementById('restoreFile').files[0];if(!f)return alert('فایل را انتخاب کنید');
let r=new FileReader();
r.onload=()=>{
try{
let x=JSON.parse(r.result);
if(!Array.isArray(x.properties)||!Array.isArray(x.customers)||!Array.isArray(x.commissions))throw 0;
db=x;save();alert('بازیابی شد');
}catch(e){alert('فایل معتبر نیست')}
};
r.readAsText(f);
}
render();
if('serviceWorker' in navigator){
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(e=>console.log(e));
});
}
</script>
</body>
</html>
